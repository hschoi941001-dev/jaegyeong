<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재경관리사 모의고사·노트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ground:#f2f3f5;--surface:#ffffff;--well:#e9ebef;--well2:#f6f7f9;
  --ink:#111722;--ink2:#3b4554;--mut:#6b7585;
  --acc:#1d4ed8;--acc-ink:#ffffff;--accfield:#e4ebfb;
  --ok:#137a45;--okfield:#e2f3e9;--bad:#bf3a2e;--badfield:#fae7e4;--warn:#9a5b06;--warnfield:#fbefd9;
  --nfs:17px;
  --ff:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#0e1116;--surface:#171b22;--well:#20252e;--well2:#1b2028;
  --ink:#eef1f5;--ink2:#c9d0da;--mut:#8d97a6;
  --acc:#7ea3ff;--acc-ink:#0e1116;--accfield:#1b2740;
  --ok:#5fd294;--okfield:#14271c;--bad:#f2867c;--badfield:#301a19;--warn:#f1b85c;--warnfield:#2c2314;
}}
.tp-FA{--tc:#1d4ed8}.tp-TX{--tc:#c9501a}.tp-CM{--tc:#0f7c55}.tp-X{--tc:#6b7585}
[class*="tp-"]{--tf:color-mix(in srgb,var(--tc) 10%,var(--surface));--tt:var(--tc)}
@media (prefers-color-scheme:dark){[class*="tp-"]{--tt:color-mix(in srgb,var(--tc) 55%,#fff);--tf:color-mix(in srgb,var(--tc) 18%,var(--surface))}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
html,body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.6 var(--ff);letter-spacing:-.011em;word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:10px}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:4px 16px 150px}
.sp{flex:1}
.row{display:flex;align-items:center;gap:10px}
.mut{color:var(--mut)}
.num{font-variant-numeric:tabular-nums}

/* page heads */
.phead{max-width:720px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 8px}
.phead h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.035em;margin:0}
.phead p{margin:8px 0 0;color:var(--ink2);font-size:16px}

/* tab bar: plain solid bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
@media (prefers-color-scheme:dark){.tabbar{background:#12161c}}
.tabbar .in{max-width:520px;margin:0 auto;display:flex}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:12px;font-weight:650;color:var(--mut);border-radius:14px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--acc)}
.tab:active{background:var(--well2)}

/* buttons: pill, flat */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--well);border-radius:999px;padding:11px 20px;min-height:48px;font-weight:700;font-size:16px;color:var(--ink);transition:transform .12s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:none}
.btn.sm{padding:7px 14px;min-height:38px;font-size:14px}
.btn.icon{width:42px;height:42px;min-height:42px;padding:0}
.btn.icon svg{width:22px;height:22px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.block{width:100%}

/* surfaces: tone steps, no lines, no shadows */
.card{background:var(--surface);border-radius:22px;padding:20px;margin-bottom:12px}
.stitle{font-size:20px;font-weight:800;letter-spacing:-.025em;margin:36px 0 12px}
.stitle small{font-size:14px;font-weight:600;color:var(--mut);letter-spacing:0;margin-left:6px}

/* exams */
.exam{display:flex;flex-direction:column;gap:14px}
.exam .t{font-weight:750;font-size:19px;letter-spacing:-.02em}
.exam .m{font-size:14px;color:var(--mut);margin-top:2px}
.exam .btns{display:flex;gap:8px;flex-wrap:wrap}
.exam .btns .btn{flex:1;min-width:120px}
.score{text-align:right;flex:none}
.score b{display:block;font-size:26px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.score span{font-size:13px;color:var(--mut)}
.prog{height:8px;background:var(--well);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);border-radius:99px}
.lead-card{background:var(--acc);color:#fff;border-radius:24px;padding:22px;margin:16px 0 4px}
.lead-card .t{font-size:22px;font-weight:800;letter-spacing:-.03em}
.lead-card .m{opacity:.85;margin:4px 0 16px}
.lead-card .btn{background:#fff;color:#1d4ed8}
@media (prefers-color-scheme:dark){.lead-card{background:#1f3b7a}}

.weak a{display:grid;grid-template-columns:12px 104px 1fr 48px;align-items:center;gap:12px;padding:12px 4px;text-decoration:none;border-radius:12px;font-size:16px}
.weak a:active{background:var(--well2)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--tt)}
.weak .bar{height:8px;border-radius:99px;background:var(--well);overflow:hidden}
.weak .bar i{display:block;height:100%;background:var(--tt)}
.weak .p{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:0;z-index:15;background:var(--ground);padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:6px}
.bar .ttl{font-weight:750;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;padding:6px 12px;border-radius:99px;background:var(--surface)}
.timer.low{color:var(--bad);background:var(--badfield)}
.qno{font-weight:800;font-variant-numeric:tabular-nums;font-size:17px}
.pbar{height:4px;background:var(--well);position:absolute;left:0;right:0;bottom:0}
.pbar i{display:block;height:100%;background:var(--acc);transition:width .25s}

/* questions */
.stem{font-size:17px;line-height:1.75}
.stem p{margin:0 0 12px}
.stem table,.fb table{border-collapse:collapse;margin:4px 0 14px;font-size:15px;display:block;overflow-x:auto;max-width:100%}
.stem td,.fb td{border-bottom:1px solid var(--well);padding:6px 14px 6px 0;white-space:nowrap;font-variant-numeric:tabular-nums}
.opt{display:flex;gap:14px;width:100%;text-align:left;border:2px solid transparent;background:var(--surface);border-radius:18px;padding:15px 16px;margin:8px 0;min-height:56px;font-size:16px;line-height:1.6;align-items:flex-start;transition:background .15s,border-color .15s}
.opt .k{flex:none;min-width:28px;font-weight:500;font-size:22px;line-height:1.15;color:var(--mut)}
.opt.sel{border-color:var(--acc);background:var(--accfield)}.opt.sel .k{color:var(--acc);font-weight:800}
.opt.ok{border-color:var(--ok);background:var(--okfield)}.opt.ok .k{color:var(--ok);font-weight:800}
.opt.bad{border-color:var(--bad);background:var(--badfield)}.opt.bad .k{color:var(--bad);font-weight:800}
.fb{font-size:15px;line-height:1.65;background:var(--well2);border-radius:16px;padding:12px 16px;margin:-2px 0 12px;color:var(--ink2)}
.fb .h{font-weight:750;font-size:14px;margin-bottom:4px;color:var(--ink)}
.fb.ok .h{color:var(--ok)}
.fb p{margin:0 0 6px}
.verdict{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;margin:6px 2px 12px}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}

/* concept panel */
.concept{background:var(--tf);border-radius:22px;padding:20px;margin:18px 0 12px}
.concept .ct{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:750;color:var(--tt)}
.concept h3{font-size:20px;line-height:1.35;letter-spacing:-.025em;margin:6px 0 10px;font-weight:800}
.concept p{margin:0 0 10px;font-size:16px;line-height:1.75}
.concept .tip{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.65;color:var(--ink2);margin-bottom:14px}
.concept .tip b{color:var(--ink)}
.concept .btn{background:var(--surface);color:var(--tt)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
.nav .btn{flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.cell{border:0;border-radius:12px;background:var(--well2);height:46px;font-size:15px;font-weight:700;position:relative;font-variant-numeric:tabular-nums}
.cell.ans{background:var(--accfield);color:var(--acc)}
.cell.cur{box-shadow:inset 0 0 0 2.5px var(--ink)}
.cell.ok{background:var(--okfield);color:var(--ok)}
.cell.bad{background:var(--badfield);color:var(--bad)}
.cell.fl::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.sheet{position:fixed;inset:0;background:rgba(5,10,20,.5);z-index:30;display:flex;align-items:flex-end;animation:fade .15s}
.sheet .pane{background:var(--ground);width:100%;max-height:84vh;overflow:auto;border-radius:26px 26px 0 0;padding:12px 20px calc(18px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sheet .pane .in{max-width:720px;margin:0 auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--well);margin:0 auto 14px}
@keyframes up{from{transform:translateY(28px);opacity:.3}}
@keyframes fade{from{opacity:0}}

table.t{width:100%;border-collapse:collapse;font-size:16px}
table.t td,table.t th{padding:11px 4px;text-align:right;font-variant-numeric:tabular-nums}
table.t tr+tr td{border-top:1px solid var(--well)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--mut);font-weight:650;font-size:14px}
table.t a{color:var(--tt,var(--acc));text-decoration:none;font-weight:750;font-size:14px}
.big{font-size:56px;font-weight:850;letter-spacing:-.045em;line-height:1}
.seg{display:flex;background:var(--well);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:8px;min-height:40px;font-size:15px;font-weight:700;border-radius:999px;color:var(--mut)}
.seg button.on{background:var(--surface);color:var(--ink)}
.flagbtn.on{color:var(--warn);background:var(--warnfield)}
.note{font-size:14px;color:var(--mut);line-height:1.6}
textarea{width:100%;font:14px/1.5 var(--ff);border:0;border-radius:14px;padding:12px;background:var(--well2);color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink2);background:var(--well);border-radius:99px;padding:4px 11px;text-decoration:none;white-space:nowrap}
a.tag{color:var(--tt);background:var(--tf)}

/* notes list */
.search{position:sticky;top:0;z-index:12;background:var(--ground);padding:calc(10px + env(safe-area-inset-top)) 16px 6px;margin:0 -16px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 18px;height:52px;transition:box-shadow .15s}
.sbox:focus-within{box-shadow:0 0 0 2.5px var(--acc)}
.sbox svg{width:20px;height:20px;color:var(--mut);flex:none}
.sbox input{flex:1;border:0;outline:0;background:none;height:100%;font-size:17px;min-width:0}
.sbox input::placeholder{color:var(--mut)}
.sbox .x{border:0;background:var(--well);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:var(--surface);border-radius:999px;padding:8px 15px;font-size:15px;font-weight:700;color:var(--ink2);min-height:40px}
.chip .c{font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums;font-size:14px}
.chip.on{background:var(--ink);color:var(--ground)}
.chip.on .c{color:inherit;opacity:.65}
.cont{display:flex;align-items:center;gap:14px;text-decoration:none;padding:18px 20px;background:var(--tf)}
.cont .k{font-size:18px;font-weight:800;letter-spacing:-.02em}
.cont .s{font-size:14px;color:var(--ink2)}
.cont svg{width:20px;height:20px;color:var(--tt)}
.glist{background:var(--surface);border-radius:22px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:12px;margin:34px 4px 12px}
.ghead .n{font-weight:800;font-size:20px;letter-spacing:-.025em;text-decoration:none}
.ghead .prog{flex:1;max-width:110px;margin-left:auto;height:6px}
.ghead .prog i{background:var(--tt)}
.ghead .c{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;font-weight:600}
.item{display:flex;align-items:center;gap:14px;padding:15px 18px;text-decoration:none;position:relative;transition:background .12s}
.item+.item{box-shadow:inset 0 1px 0 var(--well)}
.item:active{background:var(--well2)}
.rno{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--tt);background:var(--tf);font-variant-numeric:tabular-nums}
.item .tx{flex:1;min-width:0}
.item .k{font-weight:750;font-size:17px;line-height:1.35;letter-spacing:-.02em}
.item .e{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .snip{font-size:15px;color:var(--ink2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.item .st{display:flex;gap:4px;align-items:center}
.item .st svg{width:20px;height:20px}
.item .st .rd{color:var(--ok)}
.item .st .sv{color:var(--warn)}
mark{background:color-mix(in srgb,var(--acc) 24%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.empty{text-align:center;padding:56px 16px;color:var(--mut);font-size:16px}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:6px}
.skel{height:72px;border-radius:20px;background:var(--surface);margin-bottom:10px;animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.45}}

/* reader */
.rprog{position:fixed;top:0;left:0;height:3px;background:var(--tt);z-index:40;width:0}
.nhero{background:var(--tf);margin:0 -16px;padding:26px 18px 24px}
.nhero .sub{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:750;color:var(--tt)}
.nhero h1{font-size:32px;line-height:1.2;letter-spacing:-.04em;margin:8px 0 4px;font-weight:850}
.nhero .en{font-size:16px;color:var(--ink2)}
.nhero .one{font-size:calc(var(--nfs) + 1px);line-height:1.75;margin:18px 0 0;color:var(--ink)}
.jump{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:14;background:var(--ground);margin:0 -16px;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;text-decoration:none;font-size:15px;font-weight:700;color:var(--ink2);padding:8px 15px;border-radius:999px;background:var(--surface)}
.jump a.on{color:var(--acc-ink);background:var(--acc)}
.drill{display:flex;align-items:center;gap:10px;margin-top:14px;padding:14px 18px;border-radius:16px;background:var(--accfield);color:var(--acc);font-weight:800;font-size:16px;text-decoration:none}
.drill span{margin-left:auto;font-size:14px;font-weight:700;opacity:.85}
.drill:hover{filter:brightness(.97)}
.again-card{display:flex;align-items:center;gap:12px;margin-top:16px}
.again-card .t{font-size:17px;font-weight:800}
.again-card .m{font-size:14px;color:var(--mut);margin-top:2px}
.again-done{text-align:center;padding:32px 20px}
.again-done b{display:block;font-size:20px;margin-bottom:8px}
.again-done p{color:var(--ink2);margin:6px 0 16px}
.jtoc{position:sticky;left:0;z-index:1;box-shadow:0 0 0 8px var(--ground);flex:none;display:flex;align-items:center;gap:6px;border:0;font:inherit;font-size:15px;font-weight:800;color:var(--tt);background:var(--tf);padding:8px 14px 8px 11px;border-radius:999px;cursor:pointer}
.jtoc svg{width:18px;height:18px}
.side{display:none}
.sheet .side{display:block}
.side .sh{font-size:13px;font-weight:800;color:var(--mut);padding:4px 12px 8px}
.side a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--ink2);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.45;font-weight:600}
.side a.sg{color:var(--ink);font-weight:800;margin-top:6px}
.side a span{flex:none;min-width:38px;font-size:13px;font-weight:750;color:var(--tt);font-variant-numeric:tabular-nums}
.side a small{margin-left:auto;padding-left:8px;font-size:13px;font-weight:650;color:var(--mut)}
.side a:hover{background:var(--well2)}
.side a.on{background:var(--tf);color:var(--ink)}
.nsec{scroll-margin-top:calc(124px + env(safe-area-inset-top));margin-top:40px}
.nsec>h2{font-size:24px;font-weight:850;letter-spacing:-.035em;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
.nsec>h2 small{font-size:15px;font-weight:650;color:var(--mut);letter-spacing:0}
.toc{background:var(--surface);border-radius:22px;padding:8px}
.toc a{display:flex;gap:12px;align-items:baseline;padding:11px 12px;border-radius:14px;text-decoration:none;font-size:16px;font-weight:650;line-height:1.45}
.toc a:active{background:var(--well2)}
.toc a span{flex:none;font-size:14px;font-weight:750;color:var(--tt);min-width:42px;font-variant-numeric:tabular-nums}
.los{margin-top:10px}
.los summary{list-style:none;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink2);padding:6px 4px}
.los summary::-webkit-details-marker{display:none}
.los summary::after{content:" 보기";color:var(--acc)}
.los[open] summary::after{content:" 접기"}
.los ul{margin:6px 0 0;padding:0;list-style:none}
.los li{display:flex;gap:12px;margin:0 0 10px;font-size:16px;line-height:1.6}
.los li b{flex:none;color:var(--tt);min-width:42px;font-variant-numeric:tabular-nums}

.art{scroll-margin-top:calc(124px + env(safe-area-inset-top));margin:0 0 14px;background:var(--surface);border-radius:24px;padding:22px 18px;transition:box-shadow .4s}
.art.hit{box-shadow:0 0 0 3px var(--tt)}
.art .lc{display:flex;gap:6px;margin-bottom:8px}
.art .lc span{font-size:13px;font-weight:750;color:var(--tt);background:var(--tf);border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums}
.art h3{font-size:22px;line-height:1.35;font-weight:850;letter-spacing:-.03em;margin:0 0 14px}
.art p{font-size:var(--nfs);line-height:1.85;margin:0 0 16px;color:var(--ink)}
.art code,.fx .fd code,.trap code,.qa code{font-family:inherit;font-weight:700;background:var(--well);padding:1px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.ex{background:var(--well2);border-radius:18px;margin:6px 0 16px}
.ex summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 18px;font-size:15px;font-weight:800;color:var(--ink)}
.ex summary::-webkit-details-marker{display:none}
.ex summary .hint{margin-left:auto;font-size:13px;font-weight:750;color:var(--tt);background:var(--tf);border-radius:99px;padding:3px 11px}
.ex[open] summary .hint{font-size:0;padding:3px 8px}.ex[open] summary .hint::after{content:"접기";font-size:13px}
.ex>div{padding:0 18px 16px}
.ex div{font-size:calc(var(--nfs) - 1px);line-height:1.8;color:var(--ink2);white-space:pre-wrap;font-variant-numeric:tabular-nums}
.key{background:var(--tf);border-radius:18px;padding:14px 18px}
.key .l{font-size:15px;font-weight:800;color:var(--tt);margin-bottom:6px}
.key ul{margin:0;padding:0 0 0 18px}
.key li{font-size:calc(var(--nfs) - 1px);line-height:1.7;margin:2px 0;font-weight:600}
.key li::marker{color:var(--tt)}

const SUBJ = ['FA','TX','CM'];

/* ---------- data ----------
   Q:  question id ("FA-1#5") -> question, with tp (subject), rd (round), id added
   EX: exam id -> question list. "1" = round 1, all subjects (120, 150 min); "1-FA" = one subject (40, 50 min)
   N:  notes, sorted by r */
let Q = {}, EX = {}, ROUNDS = [], N = [];
const STUDY = {};
async function getJSON(u){
  try { const r = await fetch(u); if (!r.ok) return null; const t = await r.text(); return t.trim() ? JSON.parse(t) : null; }
  catch(e){ return null; }
}
function boot(){
  return Promise.all(SUBJ.map(t => Promise.all([
    getJSON(`${DATA}/q-${t}.json`),
    getJSON(`${DATA}/notes-${t}.json`),
    DATA === 'data' ? getJSON(`${DATA}/study-${t}.json`) : null
  ]))).then(res => {
    const rs = new Set();
    res.forEach(([qj, nj, study], i) => {
      const t = SUBJ[i];
      if (qj && typeof qj === 'object' && !Array.isArray(qj)) Object.keys(qj).forEach(rd => {
        if (/[-\/#]/.test(rd)) return;
        const arr = (Array.isArray(qj[rd]) ? qj[rd] : []).filter(x => x && x.q && x.o && x.n != null);
        if (!arr.length) return;
        rs.add(rd);
        arr.sort((a, b) => a.n - b.n).forEach(x => { x.n = +x.n; x.r = +x.r || 0; x.tp = t; x.rd = rd; x.id = t + '-' + rd + '#' + x.n; x.a = x.a == null ? '' : String(x.a); Q[x.id] = x; });
        EX[rd + '-' + t] = arr;
      });
      if (Array.isArray(nj)) nj.forEach(n => {
        if (!n || n.r == null || !n.t) return;
        n.r = +n.r;
        n.tp = SUBJ.includes(n.tp) ? n.tp : t;
        if (study?.[n.r]) applyStudy(n, study[n.r]);
        N.push(n);
      });
    });
    ROUNDS = [...rs].sort((a, b) => (+a) - (+b) || a.localeCompare(b));
    ROUNDS.forEach(rd => { EX[rd] = SUBJ.flatMap(t => EX[rd + '-' + t] || []); });
    N.sort((a, b) => a.r - b.r);
    N.forEach(n => { n.ix = [n.k, n.t, ...(n.los || []), ...noteText(n)].join('\n').toLowerCase(); });
  });
}
function applyStudy(n, lesson){
  n.study = lesson;
  if (lesson.intro) n.one = lesson.intro;
  if (lesson.fx) n.fx = lesson.fx;
  if (lesson.trap) n.trap = lesson.trap;
  if (lesson.chk) n.chk = lesson.chk;
  (n.sec || []).forEach(s => {
    const section = lesson.sections?.[s.h] || lesson.sections?.[s.los?.[0]];
    if (!section) return;
    if (section.keepDetail) s.detail = s.p;
    Object.assign(s, section);
  });
  STUDY[n.r] = (lesson.quiz || []).map((q, i) => {
    const id = `${n.tp}-study#${n.r}-${q.key}`;
    Q[id] = {...q, id, r: n.r, tp: n.tp, n: i + 1, study: true};
    return id;
  });
}
const isSub = id => String(id).includes('-');
const examIds = rd => [rd, ...SUBJ.filter(t => EX[rd + '-' + t]).map(t => rd + '-' + t)];
const exName = id => { const [rd, t] = String(id).split('-'); return t ? `제${rd}회 ${TN[t]}` : `제${rd}회 실전 3과목`; };
const limitOf = id => (isSub(id) ? 50 : 150) * 60;
const num = (id, q) => isSub(id) ? q.n : EX[id].indexOf(q) + 1;
const chap = r => r ? (r % 100) + '장' : '';
const graded = q => !!q.a;
const taxLine = tp => tp === 'TX' ? `<div class="taxnote">${TAXNOTE}</div>` : '';
const vLine = q => q.v ? `<div class="vchk"><b>확인 필요:</b> ${inl(q.v)}</div>` : '';
function subScores(list, ans){
  const by = {};
  list.forEach(q => { if (!graded(q)) return; const b = by[q.tp] = by[q.tp] || {n:0, ok:0}; b.n++; if (ans[q.id] === q.a) b.ok++; });
  Object.values(by).forEach(b => { b.pt = Math.round(b.ok / b.n * 1000) / 10; b.pass = b.pt >= PASS; b.need = Math.max(0, Math.ceil(b.n * PASS / 100) - b.ok); });
  return by;
}

const I = {

  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',

};
function toast(t){ const o = $('.toast'); o && o.remove(); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
// Question text: one line = one paragraph. Lines starting with § or | become table rows (cells split by 4+ spaces or |).
function rich(t){
  const out = []; let tb = null;
  const flush = () => { if (tb){ out.push('<table>' + tb.map(r => '<tr>' + r.map(c => '<td>' + esc(c.trim()) + '</td>').join('') + '</tr>').join('') + '</table>'); tb = null; } };
  for (const l of String(t == null ? '' : t).split('\n')){
    if (l.startsWith('§')){ (tb = tb || []).push(l.slice(1).split(/ {4,}/)); continue; }
    if (/^\s*\|/.test(l)){ const cells = l.trim().replace(/^\||\|$/g, '').split('|'); if (!cells.every(c => /^\s*:?-{2,}:?\s*$/.test(c))) (tb = tb || []).push(cells); continue; }
    flush();
    out.push('<p>' + esc(l) + '</p>');
  }
  flush();
  return out.join('');
}
function fmt(s){ s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h + ':' : '') + String(m).padStart(h?2:1,'0') + ':' + String(x).padStart(2,'0'); }

/* ---------- router ---------- */
let S = null, timerH = null, R = null;
function nav(h){ if (location.hash === h) route(); else location.hash = h; }
function parts(){ return location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent); }
function route(){
  const p = parts(), v = p[0] || '';
  if (S && v !== 'exam'){ persist(); stopTimer(); S = null; }
  if (v === 'exam'){ if (S) return render(); return nav('#/'); }
  stopTimer();
  if (v === 'result') return showResult(p[1], +p[2], p[3]);
  if (v === 'again') return againStart();

  if ((n.trap||[]).length) secs.push(['trap', '시험 함정', n.trap.length, n.trap.map(t => `<div class="trap"><span class="i">!</span><span>${inl(t)}</span></div>`).join('')]);

  if (cq) secs.push(['quiz', '개념 확인', cq, `<div class="art"><p>보기를 고르면 정답과 네 보기의 해설을 바로 확인할 수 있어요. 틀린 문제는 오답 복습함에 들어가요.</p><a class="lesson-action" href="#/check/${n.r}">4지선다 ${cq}문제 풀기</a></div>`]);
  if ((n.chk||[]).length) secs.push(['chk', '자가 점검', n.chk.length, n.chk.map((c, j) => `<details class="qa"><summary><span class="q">Q${j+1}</span><span>${inl(c.q)}</span><span class="hint">답 보기</span></summary><div class="a">${inl(c.a)}</div></details>`).join('')]);
  const side = `<div class="sh">목차</div><a href="#" data-go="s-core" class="sg">개념 설명<small>${(n.sec||[]).length}</small></a>`
    + (n.sec||[]).map((s, j) => `<a href="#" data-go="a-${j}" class="si"><span>${(s.los||[])[0] ? esc(s.los[0]) : j+1}</span>${inl(s.h)}</a>`).join('')
    + secs.slice(1).map(s => `<a href="#" data-go="s-${s[0]}" class="sg">${s[1]}<small>${s[2]}</small></a>`).join('');
  const lab = x => `${TN[x.tp]} ${chap(x.r)}`;
  paint(`<div class="rprog tp-${n.tp}" id="rp"></div><div class="bar nbar tp-${n.tp}"><div class="in">
    <button class="btn icon ghost" onclick="history.length>1?history.back():nav('#/notes')" aria-label="뒤로">${I.back}</button>
    <span class="ttl">${chap(n.r)} ${esc(n.t)}</span><span class="sp"></span>
    <span class="fsz"><button onclick="fsz(-1)" aria-label="글자 작게" style="font-size:13px">가</button><button onclick="fsz(1)" aria-label="글자 크게" style="font-size:18px">가</button></span>
    <button class="btn icon ghost" id="stb" onclick="toggleStar(${n.r})" aria-label="저장" style="color:${sv?'var(--warn)':'inherit'}">${sv?I.starOn:I.star}</button>
  </div></div>
  <div class="nlay tp-${n.tp}"><nav class="side" id="side" aria-label="목차">${side}</nav><div class="wrap">
    <div class="nhero rise"><div class="sub"><span class="dot"></span>${lab(n)}</div><h1>${esc(n.t)}</h1>${n.k ? `<div class="en">${esc(n.k)}</div>` : ''}${n.tp === 'TX' ? `<div class="taxnote" style="margin:12px 0 0">${TAXNOTE}</div>` : ''}${n.one ? `<p class="one">${inl(n.one)}</p>` : ''}
    ${cq ? `<a class="drill lesson-quick" href="#/check/${n.r}">개념 확인 문제 풀기<span>${cq}문제</span></a>` : ''}
    ${dq ? `<a class="drill" href="#/drill/${n.r}">이 장 문제 모아 풀기<span>모의고사 ${dq}문제</span></a>` : ''}</div>
    <nav class="jump" id="jump"><button class="jtoc" onclick="tocSheet()">${I.menu}목차</button>${secs.map(s => `<a href="#" data-to="${s[0]}">${s[1]} ${s[2]}</a>`).join('')}</nav>
    ${secs.map(s => `<section class="nsec" id="s-${s[0]}"><h2>${s[1]}<small>${s[2]}</small></h2>${s[3]}</section>`).join('')}
    ${n.study?.sources?.length ? `<details class="lesson-sources"><summary>학습 기준과 출처</summary><div class="lesson-links">${n.study.sources.map(([label, url]) => `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`).join('')}</div></details>` : ''}
    <button class="done ${rd?'on':''}" id="dn" onclick="toggleRead(${n.r})">${rd?I.check+' 읽음 표시됨':I.circle+' 다 읽었음'}</button>
    <div class="pn">${pv ? `<a href="#/note/${pv.r}" onclick="location.replace(this.href);return false"><div class="d">‹ 이전 ${lab(pv)}</div><div class="k">${esc(pv.t)}</div></a>` : '<span></span>'}${nx ? `<a class="nx" href="#/note/${nx.r}" onclick="location.replace(this.href);return false"><div class="d">다음 ${lab(nx)} ›</div><div class="k">${esc(nx.t)}</div></a>` : ''}</div>
  </div></div>`);
  const smooth = matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth';
  const jump = $('#jump');
  jump.onclick = e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); $('#s-' + a.dataset.to).scrollIntoView({behavior: smooth}); };
  document.querySelector('.toc').onclick = e => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); $('#a-' + a.dataset.a).scrollIntoView({behavior: smooth}); };
  const sd = $('#side');
  sd.onclick = goSec;
  if (spy) spy.disconnect();
  if ('IntersectionObserver' in window){
    spy = new IntersectionObserver(es => {
      es.forEach(e => {
        if (!e.isIntersecting) return;
        const id = e.target.id;
        if (id.startsWith('s-')){ jump.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.to === id.slice(2))); const on = jump.querySelector('.on'); on && jump.scrollTo({left: on.offsetLeft - jump.querySelector('.jtoc').offsetWidth - 28, behavior: smooth}); }
        // side list: an article wins over its parent section, so the core section only marks itself before the first article
        if (!id || (id === 's-core' && sd.querySelector('.si.on'))) return;
        sd.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.go === id));
        const a = sd.querySelector('.on');
        if (a && (a.offsetTop < sd.scrollTop + 40 || a.offsetTop > sd.scrollTop + sd.clientHeight - 60)) sd.scrollTop = a.offsetTop - sd.clientHeight / 3;
      });
    }, {rootMargin: '-130px 0px -60% 0px'});
    document.querySelectorAll('.nsec, .art').forEach(s => spy.observe(s));
  }
  const rp = $('#rp');
  onscroll = () => { if (!rp.isConnected){ onscroll = null; return; } const h = document.documentElement.scrollHeight - innerHeight; rp.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%'; };
  if (losCode){
    const t = [...document.querySelectorAll('.art')].find(a => a.dataset.los.split(' ').includes(losCode));
    const go = t || $('#s-core');
    setTimeout(() => { go.scrollIntoView(); if (t){ t.classList.add('hit'); setTimeout(() => t.classList.remove('hit'), 2400); } }, 60);
  }
}
function goSec(e){
  const a = e.target.closest('a[data-go]'); if (!a) return; e.preventDefault();
  $('#sh') && $('#sh').remove();
  $('#' + a.dataset.go).scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'});
}
// Mobile: same list as the desktop sidebar, in a bottom sheet
function tocSheet(){
  const d = document.createElement('div'); d.className = 'sheet'; d.id = 'sh';
  d.onclick = e => { if (e.target === d) d.remove(); else goSec(e); };
  d.innerHTML = `<div class="pane"><div class="in"><div class="grab"></div><nav class="side">${$('#side').innerHTML}</nav></div></div>`;
  document.body.appendChild(d);
  const on = d.querySelector('.on'); on && on.scrollIntoView({block: 'center'});
}
function fxCard(n, f){
  return `<div class="fx tp-${n.tp}"><div class="fn">${inl(f.n)}<button class="cp" onclick="copyFx(this)" aria-label="공식 복사">${I.copy}</button></div><div class="ff">${esc(f.f || '')}</div>${f.d ? `<div class="fd">${inl(f.d)}</div>` : ''}</div>`;
}
function copyFx(b){ const t = b.closest('.fx').querySelector('.ff').textContent; try { navigator.clipboard.writeText(t).then(() => toast('공식 복사됨')); } catch(e){} }
function fsz(d){ const v = Math.min(21, Math.max(15, load('fs', 17) + d)); save('fs', v); document.documentElement.style.setProperty('--nfs', v + 'px'); toast('글자 크기 ' + v); }
function toggleStar(r){ const m = starMap(); if (m[r]) delete m[r]; else m[r] = 1; save('nstar', m); const b = $('#stb'); b.innerHTML = m[r] ? I.starOn : I.star; b.style.color = m[r] ? 'var(--warn)' : 'inherit'; toast(m[r] ? '저장함' : '저장 해제'); }
function toggleRead(r){ const m = readMap(); if (m[r]) delete m[r]; else m[r] = Date.now(); save('nread', m); const b = $('#dn'); b.classList.toggle('on', !!m[r]); b.innerHTML = m[r] ? I.check + ' 읽음 표시됨' : I.circle + ' 다 읽었음'; if (m[r]) toast('읽음 표시함'); }

/* ---------- formulas ---------- */
let FQ = '';
function fxList(f){
  if (!N.length) return paint(noNotes('fx'));
  const has = t => N.some(n => n.tp === t && (n.fx||[]).length);
  const cnt = t => N.filter(n => t === 'all' || n.tp === t).reduce((s, n) => s + (n.fx||[]).length, 0);
  const chip = k => `<button class="chip ${f===k?'on':''} ${k!=='all'?'tp-'+k:''}" onclick="location.replace('#/fx/${k}')">${k!=='all'?'<span class="dot"></span>':''}${k==='all'?'전체':TN[k]}<span class="c">${cnt(k)}</span></button>`;
  paint(`<header class="phead"><h1>공식집</h1><p>공식·한도 ${cnt('all')}개를 장 순서로 모음. 제목을 누르면 그 노트로 감.</p></header>
  <div class="wrap" style="padding-top:0"><div class="search"><label class="sbox">${I.search}<input id="fq" type="text" placeholder="공식 이름이나 기호 검색" value="${esc(FQ)}" autocomplete="off"></label>
  <div class="chips">${chip('all')}${TORDER.filter(has).map(chip).join('')}</div></div><div id="fl"></div></div>${tabbar('fx')}`, true);
  const inp = $('#fq'); let tmr; inp.oninput = () => { clearTimeout(tmr); tmr = setTimeout(() => { FQ = inp.value; drawFx(f); }, 120); };
  const oc = document.querySelector('.chips .chip.on'); oc && oc.scrollIntoView({inline:'center', block:'nearest'});
  drawFx(f);
}
function drawFx(f){
  const q = FQ.trim().toLowerCase();
  const ns = N.filter(n => (f === 'all' || n.tp === f) && (n.fx||[]).length);
  let html = '';
  ns.forEach(n => {
    const fs = n.fx.filter(x => !q || (x.n + ' ' + x.f + ' ' + (x.d||'') + ' ' + n.k + ' ' + n.t).toLowerCase().includes(q));
    if (!fs.length) return;
    html += `<div class="ghead tp-${n.tp}"><span class="rno" style="width:36px;height:36px;font-size:14px;border-radius:12px">${n.r % 100}</span><a class="n" href="#/note/${n.r}">${esc(n.t)} ›</a><span class="c" style="margin-left:auto">${fs.length}</span></div>` + fs.map(x => fxCard(n, x)).join('');
  });
  $('#fl').innerHTML = html || `<div class="empty"><b>${q ? '‘' + esc(FQ) + '’ 공식 없음' : '공식 없음'}</b>${q ? '다른 이름이나 기호로 검색.' : ''}</div>`;
}

document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
paint(`<div class="wrap" style="padding-top:80px"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`);
boot().catch(() => {}).then(route);
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
